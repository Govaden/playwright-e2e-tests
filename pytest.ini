[pytest]
testpaths = tests
base_url = https://www.saucedemo.com

addopts =
    --browser=chromium
    --tracing=retain-on-failure
    --video=retain-on-failure
    --screenshot=only-on-failure
    --output=reports/artifacts
    --junit-xml=reports/junit/results.xml
    --alluredir=allure-results
    --clean-alluredir